# Renovate 依赖检测(检测模式):只更新 Dependency Dashboard,不自动开 PR。
# 升级 PR 需在台账 /ops/oss 里先 AI 评估可行,再由后端勾选 Dashboard 对应项触发。
name: Renovate

on:
  schedule:
    - cron: '0 20 * * *'   # 每天 04:00 北京时间
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v40
        with:
          configurationFile: renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
