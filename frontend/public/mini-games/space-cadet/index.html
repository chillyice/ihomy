<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>3D Pinball · Space Cadet</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background: radial-gradient(120% 120% at 50% 0%, #1c2333 0%, #0a0c12 70%);
    color: #c8d2e4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
  }

  /* 舞台:竖屏按「记分板在上 → 主画面居中 → 手柄贴底」排,尺寸由脚本按可用空间算 */
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }
  #rig {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    max-width: 100%;
    max-height: 100%;
  }
  /* 记分板:每帧从画布底部记分带拷一张过来,竖屏固定在最上面 */
  #hud {
    display: block;
    width: 100%;
    background: #000;
    border-radius: 8px;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.07);
  }
  /* 取不到画面时退回整张机台(记分带留在主画面底部) */
  body.no-split #hud { display: none; }
  /* 主画面:画布是整张机台,靠 overflow 把底部记分带裁掉 */
  #field {
    position: relative;
    overflow: hidden;
    border-radius: 10px;
    background: #000;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.07);
  }
  #canvas {
    position: absolute;
    left: 0;
    top: 0;
    display: block;
    outline: none;
    background: #000;
    touch-action: manipulation;
  }

  /* 载入/报错状态 */
  #status {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    max-width: 80%;
    text-align: center;
    font-size: 13px;
    line-height: 1.8;
    color: #8b9ab5;
    pointer-events: none;
  }
  #status[hidden] { display: none; }

  /* 手柄:触屏才出现。竖屏占最底一行,横屏浮在画面底部两侧(不占布局) */
  #pad { display: none; }
  .tk {
    appearance: none;
    -webkit-appearance: none;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(18, 24, 38, 0.72);
    color: #dbe4f5;
    font-weight: 600;
    letter-spacing: 0.5px;
    touch-action: none;
    backdrop-filter: blur(8px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    transition: transform 0.08s ease, background 0.12s ease, box-shadow 0.12s ease;
  }
  .tk:active,
  .tk.down {
    transform: scale(0.96);
    background: rgba(96, 140, 255, 0.5);
    box-shadow: 0 0 24px rgba(96, 140, 255, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
  }
  .tk-flip { height: clamp(84px, 12vh, 128px); border-radius: 22px; font-size: 15px; }
  .tk-flip .glyph { font-size: 22px; line-height: 1; }
  .tk-mid { display: flex; flex-direction: column; gap: 6px; }
  .tk-launch { height: clamp(52px, 7.5vh, 80px); border-radius: 16px; font-size: 13px; }
  /* 震桌 = 引擎的 Bump Left 键(88),和挡板分开;比发球矮一档,按住即连续抖桌面 */
  .tk-nudge { height: clamp(38px, 4.6vh, 48px); border-radius: 12px; font-size: 12px; font-weight: 500; opacity: 0.86; }
  @media (pointer: coarse) and (orientation: portrait) {
    #rig { width: 100%; height: 100%; justify-content: space-between; }
    #pad { display: flex; align-items: flex-end; gap: 10px; width: 100%; }
    #pad .tk-flip { flex: 1 1 0; }
    #pad .tk-mid { flex: 0 0 92px; }
    /* 退回整张机台时记分板不显示,靠自动外边距把机台垫在中间、手柄仍贴底 */
    body.no-split #field { margin-block: auto; }
  }
  @media (pointer: coarse) and (orientation: landscape) {
    #rig { justify-content: center; }
    /* 横屏机台居中,两侧留出来的空白正好放手柄,不压画面 */
    #pad {
      display: block;
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    #pad .tk-flip,
    #pad .tk-mid {
      position: absolute;
      width: 104px;
    }
    #pad .tk-mid {
      right: 14px;
      bottom: calc(100px + env(safe-area-inset-bottom, 0px));
      gap: 8px;
    }
    #pad [data-key='90'] {
      left: 14px;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    }
    #pad [data-key='191'] {
      right: 14px;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    }
    #pad .tk-flip { height: 76px; }
  }

  /* 触屏上键盘改绑没有意义,齿轮与面板只在鼠标环境露出 */
  @media (pointer: coarse) {
    #gear,
    #kbPanel { display: none !important; }
  }

  /* 按键设置:齿轮入口 + 重绑定面板(桌面与触屏都可用) */
  #gear {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(20, 26, 40, 0.5);
    color: #c8d2e4;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    opacity: 0.65;
    transition: opacity 0.15s ease, background 0.15s ease;
  }
  #gear:hover { opacity: 1; background: rgba(60, 80, 130, 0.55); }
  #kbPanel {
    position: absolute;
    top: 52px;
    right: 10px;
    width: 250px;
    padding: 14px 16px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(16, 20, 32, 0.92);
    color: #c8d2e4;
    font-size: 13px;
    display: none;
  }
  #kbPanel.open { display: block; }
  #kbPanel h3 {
    margin: 0 0 10px;
    font-size: 14px;
    color: #e6edf8;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #kbClose {
    border: 0;
    background: none;
    color: #8b9ab5;
    font-size: 15px;
    cursor: pointer;
    padding: 2px 4px;
  }
  #kbClose:hover { color: #dbe4f5; }
  .kb-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .kb-key {
    min-width: 84px;
    padding: 5px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: rgba(40, 50, 78, 0.6);
    color: #dbe4f5;
    font-size: 12px;
    cursor: pointer;
    text-align: center;
  }
  .kb-key:hover { background: rgba(70, 90, 140, 0.65); }
  .kb-key.listening { border-color: #7aa2ff; color: #bcd0ff; background: rgba(60, 90, 170, 0.5); }
  .kb-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
  }
  #kbReset {
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 8px;
    background: none;
    color: #8b9ab5;
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
  }
  #kbReset:hover { color: #dbe4f5; background: rgba(60, 80, 130, 0.4); }
  .kb-hint { margin: 0; font-size: 11px; color: #76839c; line-height: 1.6; }
</style>
</head>
<body>
<div id="stage">
  <div id="rig">
    <canvas id="hud" aria-label="记分板"></canvas>
    <div id="field">
      <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    </div>
    <div id="pad">
      <button class="tk tk-flip" data-key="90" aria-label="左挡板"><span class="glyph">◀</span>左挡板</button>
      <div class="tk-mid">
        <button class="tk tk-launch" data-key="32" aria-label="发球">发球</button>
        <button class="tk tk-nudge" data-key="88" aria-label="震动桌面">震动桌面</button>
      </div>
      <button class="tk tk-flip" data-key="191" aria-label="右挡板">右挡板<span class="glyph">▶</span></button>
    </div>
  </div>
  <div id="status">载入中…</div>
  <button id="gear" aria-label="按键设置">⚙</button>
  <div id="kbPanel" role="dialog" aria-label="按键设置">
    <h3>按键设置 <button id="kbClose" aria-label="关闭">✕</button></h3>
    <div class="kb-row"><span>左挡板</span><button class="kb-key" data-slot="left"></button></div>
    <div class="kb-row"><span>右挡板</span><button class="kb-key" data-slot="right"></button></div>
    <div class="kb-row"><span>发球</span><button class="kb-key" data-slot="launch"></button></div>
    <div class="kb-row"><span>震动桌面</span><button class="kb-key" data-slot="nudge"></button></div>
    <div class="kb-row"><span>开新局</span><button class="kb-key" data-slot="new"></button></div>
    <div class="kb-foot">
      <button id="kbReset">恢复默认</button>
      <p class="kb-hint">点键位后按新键即可改绑;<br>Esc 取消,原默认键始终有效。</p>
    </div>
  </div>
</div>

<script>
  // 主画面与记分板拆开:引擎把整幅画面(顶部菜单 + 左侧机台 + 右侧信息板)画进同一张
  // WebGL 画布,没有分数接口可读——只能按实测像素矩形裁:主画面直接用画布本身
  // (靠负偏移 + overflow 只露机台,零拷贝),记分板每帧把有用内容拷到独立小 canvas。
  // 拷贝要求画布在合成后仍保留像素,所以创建 WebGL 上下文时打开 preserveDrawingBuffer。
  // 引擎脚本是 async 加载的,这段必须先执行,补丁才能生效。
  // 下面所有数值都以引擎画面 642×525 为基准(由实测画布 829×678 换算)。
  const TABLE_W = 642 // 引擎整幅画面(含菜单栏与右侧信息板),不是机台本身
  const TABLE_H = 525
  // 机台矩形(含灰色机箱边框):主画面只露这一块
  const FIELD_X = 3.1
  const FIELD_Y = 39.5
  const FIELD_W = 385.7
  const FIELD_H = 446
  // 记分板两块有用内容:左「BALL 数字」(带 BALL 字样与红框)、右「玩家号 + 分数条」
  const BALL_X = 525.1
  const BALL_Y = 199
  const BALL_W = 93
  const BALL_H = 34.1
  const SCORE_X = 424.4
  const SCORE_Y = 245.5
  const SCORE_W = 193.6
  const SCORE_H = 34.1
  const HUD_GAP = 4.6 // 两块之间留一条黑缝
  const HUD_W = BALL_W + HUD_GAP + SCORE_W
  const HUD_H = Math.max(BALL_H, SCORE_H)
  ;(function patchCanvasContext() {
    const raw = HTMLCanvasElement.prototype.getContext
    HTMLCanvasElement.prototype.getContext = function (type, attrs) {
      if (typeof type === 'string' && type.indexOf('webgl') !== -1) {
        attrs = Object.assign({}, attrs, { preserveDrawingBuffer: true })
      }
      return raw.call(this, type, attrs)
    }
  })()

  // 记录 SDL 把键盘监听挂在了哪个目标上(document / window / canvas 都可能有),
  // 触屏按钮才能把合成按键事件投递到真正收得到的地方。
  const keyTargets = new Set()
  const rawAdd = EventTarget.prototype.addEventListener
  EventTarget.prototype.addEventListener = function (type, fn, opts) {
    if (type === 'keydown' || type === 'keyup') keyTargets.add(this)
    return rawAdd.call(this, type, fn, opts)
  }

  const statusEl = document.getElementById('status')
  let statusDone = false

  window.Module = {
    canvas: (function () {
      const c = document.getElementById('canvas')
      c.addEventListener(
        'webglcontextlost',
        function (e) {
          e.preventDefault()
          showStatus('图形上下文丢失,刷新页面继续', false)
        },
        false,
      )
      return c
    })(),
    print: function () {},
    printErr: function (msg) {
      if (window.console) console.warn('[pinball]', msg)
    },
    setStatus: function (text) {
      if (!text) {
        statusEl.hidden = true
        statusDone = true
        return
      }
      if (statusDone || /All downloads complete/.test(text)) {
        statusEl.hidden = true
        return
      }
      showStatus(text, true)
    },
    monitorRunDependencies: function (left) {
      if (left === 0) statusEl.hidden = true
    },
  }

  function showStatus(text, spinner) {
    statusEl.hidden = false
    statusEl.textContent = spinner ? text : text
  }

  window.addEventListener('error', function (e) {
    if (!statusDone) showStatus('载入失败:' + (e.message || '未知错误'), false)
  })

  // —— 主画面 / 记分板布局 ——
  const stageEl = document.getElementById('stage')
  const fieldEl = document.getElementById('field')
  const canvasEl = document.getElementById('canvas')
  const hudEl = document.getElementById('hud')
  const hudCtx = hudEl.getContext('2d')
  const padEl = document.getElementById('pad')
  const STAGE_PAD = 16 // 与 #stage 的 padding 8px 一致(左右/上下各 8)
  const RIG_GAP = 6 // 与 #rig 的 gap 一致
  // 裁切参数已按引擎实际渲染定准,默认拆分;取不到画面时仍会退回整张机台。
  const SPLIT_ENABLED = true
  let splitOn = SPLIT_ENABLED
  let fieldW = 0
  let hudH = 0

  // 手柄竖屏占布局一行、横屏 fixed 浮层(不占)。按透视后的样式判断,不用另存状态。
  function padHeight() {
    const cs = window.getComputedStyle(padEl)
    if (cs.display === 'none' || cs.position === 'fixed') return 0
    return padEl.offsetHeight || 0
  }

  function layout() {
    const availW = Math.max(80, stageEl.clientWidth - STAGE_PAD)
    const availH = Math.max(80, stageEl.clientHeight - STAGE_PAD)
    // 竖着放「记分板 + 主画面 + 手柄」,三段加起来不出屏:宽度靠可用高反推,再与可用宽取小。
    const padH = padHeight()
    const reserved = RIG_GAP + (padH ? padH + RIG_GAP : 0)
    // 拆分后主画面只占机台矩形,记分板另有自己的宽高比,两者一起参与高度预算。
    const cropW = splitOn ? FIELD_W : TABLE_W
    const cropH = splitOn ? FIELD_H : TABLE_H
    const hudRatio = splitOn ? HUD_H / HUD_W : 0
    const perWidth = cropH / cropW + hudRatio
    fieldW = Math.max(80, Math.floor(Math.min(availW, (availH - reserved) / perWidth)))
    const fieldH = Math.floor((fieldW * cropH) / cropW)
    hudH = splitOn ? Math.floor((fieldW * HUD_H) / HUD_W) : 0
    const dpr = window.devicePixelRatio || 1
    // 画布 CSS 尺寸永远按整幅 642×525,靠负偏移 + #field 的 overflow 只露出机台
    const scale = fieldW / cropW

    fieldEl.style.width = fieldW + 'px'
    fieldEl.style.height = fieldH + 'px'
    canvasEl.style.width = Math.round(TABLE_W * scale) + 'px'
    canvasEl.style.height = Math.round(TABLE_H * scale) + 'px'
    canvasEl.style.left = splitOn ? -FIELD_X * scale + 'px' : '0px'
    canvasEl.style.top = splitOn ? -FIELD_Y * scale + 'px' : '0px'

    if (splitOn) {
      hudEl.style.height = hudH + 'px'
      hudEl.width = Math.max(1, Math.round(fieldW * dpr))
      hudEl.height = Math.max(1, Math.round(hudH * dpr))
      hudCtx.imageSmoothingEnabled = false
    }
  }

  // 画布 CSS 尺寸变了要让引擎重算窗口(它自己监听 resize 同步画布分辨率)
  let selfResize = false
  function syncEngine() {
    selfResize = true
    try {
      window.dispatchEvent(new Event('resize'))
    } finally {
      selfResize = false
    }
  }

  let resizeTimer = 0
  window.addEventListener('resize', function () {
    if (selfResize) return
    clearTimeout(resizeTimer)
    resizeTimer = setTimeout(function () {
      layout()
      syncEngine()
    }, 60)
  })

  // 外框(站内 GameShell)可能在我们脚本跑完之后才定好 iframe 尺寸,
  // 那次变化不一定落成 resize 事件 —— 盯着舞台自身尺寸再排一次。
  if (typeof ResizeObserver === 'function') {
    let lastW = 0
    let lastH = 0
    new ResizeObserver(function () {
      const w = stageEl.clientWidth
      const h = stageEl.clientHeight
      if (w === lastW && h === lastH) return
      lastW = w
      lastH = h
      layout()
      syncEngine()
    }).observe(stageEl)
  }

  // 手柄竖屏占布局、横屏浮层:翻转时尺寸可能没变(近方形窗口),按方向再排一次
  if (window.matchMedia) {
    const mqOrient = window.matchMedia('(orientation: portrait)')
    const onOrient = function () {
      layout()
      syncEngine()
    }
    if (mqOrient.addEventListener) mqOrient.addEventListener('change', onOrient)
    else if (mqOrient.addListener) mqOrient.addListener(onOrient)
  }

  // —— 每帧把记分带拷到记分板 ——
  const PROBE_GAP = 900 // 探针间隔
  const PROBE_MISS_LIMIT = 6 // 载入完成后再空等这么多轮才判定取不到画面
  let probeAt = 0
  let probeMiss = 0
  let splitSettled = false
  function pump() {
    requestAnimationFrame(pump)
    const cw = canvasEl.width
    const ch = canvasEl.height
    if (!splitOn || !cw || !ch || !hudEl.width) return
    const kx = cw / TABLE_W
    const ky = ch / TABLE_H
    const hudW = hudEl.width
    const hudHpx = hudEl.height
    // 左:BALL 数字(含 BALL 字样),右:玩家号 + 分数条;两块拼成一条贴在顶部
    const ballW = Math.max(1, Math.round((BALL_W / HUD_W) * hudW))
    const scoreX = Math.max(1, Math.round(((BALL_W + HUD_GAP) / HUD_W) * hudW))
    hudCtx.fillStyle = '#000'
    hudCtx.fillRect(0, 0, hudW, hudHpx)
    hudCtx.drawImage(
      canvasEl,
      Math.round(BALL_X * kx),
      Math.round(BALL_Y * ky),
      Math.max(1, Math.round(BALL_W * kx)),
      Math.max(1, Math.round(BALL_H * ky)),
      0,
      0,
      ballW,
      hudHpx,
    )
    hudCtx.drawImage(
      canvasEl,
      Math.round(SCORE_X * kx),
      Math.round(SCORE_Y * ky),
      Math.max(1, Math.round(SCORE_W * kx)),
      Math.max(1, Math.round(SCORE_H * ky)),
      scoreX,
      0,
      hudW - scoreX,
      hudHpx,
    )

    // 兜底:引擎已经出画面,记分带却迟迟全黑 —— 多半是上下文没保留像素,
    // 退回整张机台(记分带仍留在主画面底部),别让记分板一直空着。
    if (splitSettled || !engineReady()) return
    const now = Date.now()
    if (now < probeAt) return
    probeAt = now + PROBE_GAP
    if (bandHasInk()) {
      splitSettled = true
      return
    }
    probeMiss++
    if (probeMiss >= PROBE_MISS_LIMIT) fallbackToFullTable()
  }

  function engineReady() {
    return typeof window.Module !== 'undefined' && window.Module.calledRun === true && canvasEl.width > 0
  }

  function bandHasInk() {
    try {
      const w = hudEl.width
      const h = hudEl.height
      const data = hudCtx.getImageData(0, 0, w, h).data
      for (let i = 0; i < data.length; i += 4) {
        if (data[i] + data[i + 1] + data[i + 2] > 24) return true
      }
    } catch (_) {
      return true // 读不到就当正常,别误降级
    }
    return false
  }

  function fallbackToFullTable() {
    splitOn = false
    splitSettled = true
    document.body.classList.add('no-split')
    layout()
    syncEngine()
  }

  // —— 触屏 → 键盘 ——
  function pressKey(code, down) {
    // SDL 的键盘监听实测挂在 document 上;window 是 Emscripten 运行时先注册的,
    // 事件派发到 window 不会向下传到 document,SDL 收不到 —— 所以优先 document。
    const target = keyTargets.has(document)
      ? document
      : keyTargets.size
        ? keyTargets.values().next().value
        : document
    const ev = new KeyboardEvent(down ? 'keydown' : 'keyup', {
      key: String.fromCharCode(code),
      bubbles: true,
      cancelable: true,
    })
    Object.defineProperty(ev, 'keyCode', { get: () => code })
    Object.defineProperty(ev, 'which', { get: () => code })
    ev.__pbSynthetic = true
    target.dispatchEvent(ev)
  }

  // —— 按键设置:重绑定 + 翻译层 ——
  // 五个动作各自绑一个物理键(code 匹配);SDL 内部只认默认键码,改绑靠
  // 捕获阶段把用户的键翻译成默认键再转发给 SDL,原默认键始终直通。
  // 默认键取自引擎自带键表:90 左挡板 / 191 右挡板 / 32 发球 / 88 震桌(Bump Left)/ 113 开新局。
  const SLOT_CANON = {
    left: { code: 'KeyZ', keyCode: 90 },
    right: { code: 'Slash', keyCode: 191 },
    launch: { code: 'Space', keyCode: 32 },
    nudge: { code: 'KeyX', keyCode: 88 },
    new: { code: 'F2', keyCode: 113 },
  }
  const DEFAULT_KEYS = {
    left: { code: 'KeyZ', key: 'z', keyCode: 90, label: 'Z' },
    right: { code: 'Slash', key: '/', keyCode: 191, label: '/' },
    launch: { code: 'Space', key: ' ', keyCode: 32, label: '空格' },
    nudge: { code: 'KeyX', key: 'x', keyCode: 88, label: 'X' },
    new: { code: 'F2', key: 'F2', keyCode: 113, label: 'F2' },
  }
  // v2:旧版把 88 当成「右挡板」默认键存进 localStorage,升级后会和震桌抢同一个键
  const KB_STORE = 'ihomy:pinball:keys:v2'
  let bindings = loadBindings()
  let listeningSlot = null

  function loadBindings() {
    try {
      const raw = JSON.parse(localStorage.getItem(KB_STORE) || '{}')
      const out = {}
      for (const slot of Object.keys(SLOT_CANON)) {
        const b = raw[slot]
        out[slot] =
          b && b.code && typeof b.keyCode === 'number'
            ? { code: b.code, key: b.key || '', keyCode: b.keyCode, label: b.label || b.code }
            : DEFAULT_KEYS[slot]
      }
      return out
    } catch (_) {
      return { ...DEFAULT_KEYS }
    }
  }
  function saveBindings() {
    try {
      localStorage.setItem(KB_STORE, JSON.stringify(bindings))
    } catch (_) {
      /* 隐私模式等写不进就算了,本次会话仍生效 */
    }
  }
  function keyLabel(key, code) {
    if (key === ' ') return '空格'
    if (!key) return code
    return key.length === 1 ? key.toUpperCase() : key
  }

  // 翻译层:window 捕获先于 document 上的 SDL 监听;命中改绑键就吃掉并
  // 转发默认键码。默认键与合成事件(触屏按钮/面板)直通不拦。
  function translateKey(e, down) {
    if (e.__pbSynthetic || listeningSlot) return
    for (const slot of Object.keys(SLOT_CANON)) {
      const b = bindings[slot]
      if (b.code === SLOT_CANON[slot].code) continue // 绑的就是默认键,无需翻译
      if (b.code === e.code) {
        e.preventDefault()
        e.stopPropagation()
        pressKey(SLOT_CANON[slot].keyCode, down)
        return
      }
    }
  }
  window.addEventListener(
    'keydown',
    function (e) {
      translateKey(e, true)
    },
    true,
  )
  window.addEventListener(
    'keyup',
    function (e) {
      translateKey(e, false)
    },
    true,
  )

  // —— 设置面板 ——
  const kbPanel = document.getElementById('kbPanel')
  const kbKeyBtns = document.querySelectorAll('#kbPanel .kb-key')
  function renderPanel() {
    kbKeyBtns.forEach(function (btn) {
      const slot = btn.dataset.slot
      btn.textContent = listeningSlot === slot ? '按新按键…' : bindings[slot].label
      btn.classList.toggle('listening', listeningSlot === slot)
    })
  }
  document.getElementById('gear').addEventListener('click', function () {
    listeningSlot = null
    kbPanel.classList.toggle('open')
    renderPanel()
  })
  document.getElementById('kbClose').addEventListener('click', function () {
    listeningSlot = null
    kbPanel.classList.remove('open')
  })
  document.getElementById('kbReset').addEventListener('click', function () {
    for (const slot of Object.keys(SLOT_CANON)) bindings[slot] = { ...DEFAULT_KEYS[slot] }
    listeningSlot = null
    saveBindings()
    renderPanel()
  })
  kbKeyBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      listeningSlot = btn.dataset.slot
      renderPanel()
    })
  })
  // 监听态:window 捕获抢先吃掉这一下,绑定为「物理键 code + 当时的键码」。
  // Esc 取消;没有 code 的键(修饰键怪异态等)忽略。
  window.addEventListener(
    'keydown',
    function (e) {
      if (!listeningSlot) return
      e.preventDefault()
      e.stopPropagation()
      if (e.key === 'Escape') {
        listeningSlot = null
        renderPanel()
        return
      }
      if (!e.code) return
      const slot = listeningSlot
      bindings[slot] = { code: e.code, key: e.key, keyCode: e.keyCode, label: keyLabel(e.key, e.code) }
      listeningSlot = null
      saveBindings()
      renderPanel()
    },
    true,
  )
  renderPanel()


  // 手柄按键:按下/抬起都派发到 SDL 收得到的目标;手指滑出仍算抬起,别卡住挡板
  document.querySelectorAll('#pad .tk').forEach(function (btn) {
    const code = Number(btn.dataset.key)
    let held = false
    const release = function (e) {
      if (!held) return
      held = false
      btn.classList.remove('down')
      e.preventDefault()
      pressKey(code, false)
    }
    btn.addEventListener('pointerdown', function (e) {
      e.preventDefault()
      held = true
      btn.classList.add('down')
      try {
        btn.setPointerCapture(e.pointerId)
      } catch (_) {
        /* 合成事件没有真实 pointerId,捕获失败不影响按键 */
      }
      pressKey(code, true)
    })
    btn.addEventListener('pointerup', release)
    btn.addEventListener('pointercancel', release)
    btn.addEventListener('pointerleave', release)
    btn.addEventListener('contextmenu', function (e) {
      e.preventDefault()
    })
  })

  // 「新游戏」键搬到了站内外壳(GameShell)的头部、规则键左侧;
  // 外框只发 postMessage,这里合成一次 F2 交回引擎
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent) return
    const data = e.data
    if (!data || data.type !== 'ihomy:pinball:new') return
    pressKey(113, true)
    pressKey(113, false)
  })

  // 点一下画面把焦点交给 canvas,否则外框里按键可能被父页面吃掉
  stageEl.addEventListener('pointerdown', function () {
    if (canvasEl && canvasEl.focus) canvasEl.focus()
  })

  if (!SPLIT_ENABLED) document.body.classList.add('no-split')
  layout()
  syncEngine()
  requestAnimationFrame(pump)
</script>
<script async src="SpaceCadetPinball.js"></script>
</body>
</html>
