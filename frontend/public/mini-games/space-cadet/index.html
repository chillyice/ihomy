<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>3D Pinball · Space Cadet</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background: radial-gradient(120% 120% at 50% 0%, #1c2333 0%, #0a0c12 70%);
    color: #c8d2e4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
  }

  /* 舞台:canvas 用 object-fit 等比塞满,留黑边而不是拉伸变形 */
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #canvas {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    outline: none;
    background: #000;
    touch-action: manipulation;
  }
  #canvas:fullscreen { width: 100vw; height: 100vh; }

  /* 载入/报错状态 */
  #status {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    max-width: 80%;
    text-align: center;
    font-size: 13px;
    line-height: 1.8;
    color: #8b9ab5;
    pointer-events: none;
  }
  #status[hidden] { display: none; }

  /* 触屏操作条:键位与桌面一致(Z 左挡板 / X 右挡板 / 空格发球 / F2 开新局) */
  #touch { display: none; }
  @media (pointer: coarse) {
    #touch {
      position: absolute;
      inset: auto 0 0 0;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      padding: 0 12px 14px;
      pointer-events: none;
    }
    .tk {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(20, 26, 40, 0.55);
      color: #dbe4f5;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      backdrop-filter: blur(6px);
      transition: transform 0.08s ease, background 0.12s ease;
    }
    .tk:active { transform: scale(0.94); background: rgba(120, 160, 255, 0.42); }
    .tk-center { display: flex; flex: 1 1 auto; gap: 10px; justify-content: center; }
    .tk-wide { width: 88px; border-radius: 32px; font-size: 13px; }
    .tk-sm { width: 48px; height: 48px; font-size: 11px; font-weight: 500; align-self: flex-start; opacity: 0.85; }
  }

  /* 按键设置:齿轮入口 + 重绑定面板(桌面与触屏都可用) */
  #gear {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(20, 26, 40, 0.5);
    color: #c8d2e4;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    opacity: 0.65;
    transition: opacity 0.15s ease, background 0.15s ease;
  }
  #gear:hover { opacity: 1; background: rgba(60, 80, 130, 0.55); }
  #kbPanel {
    position: absolute;
    top: 52px;
    right: 10px;
    width: 250px;
    padding: 14px 16px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(16, 20, 32, 0.92);
    color: #c8d2e4;
    font-size: 13px;
    display: none;
  }
  #kbPanel.open { display: block; }
  #kbPanel h3 {
    margin: 0 0 10px;
    font-size: 14px;
    color: #e6edf8;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #kbClose {
    border: 0;
    background: none;
    color: #8b9ab5;
    font-size: 15px;
    cursor: pointer;
    padding: 2px 4px;
  }
  #kbClose:hover { color: #dbe4f5; }
  .kb-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .kb-key {
    min-width: 84px;
    padding: 5px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: rgba(40, 50, 78, 0.6);
    color: #dbe4f5;
    font-size: 12px;
    cursor: pointer;
    text-align: center;
  }
  .kb-key:hover { background: rgba(70, 90, 140, 0.65); }
  .kb-key.listening { border-color: #7aa2ff; color: #bcd0ff; background: rgba(60, 90, 170, 0.5); }
  .kb-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
  }
  #kbReset {
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 8px;
    background: none;
    color: #8b9ab5;
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
  }
  #kbReset:hover { color: #dbe4f5; background: rgba(60, 80, 130, 0.4); }
  .kb-hint { margin: 0; font-size: 11px; color: #76839c; line-height: 1.6; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">载入中…</div>
  <div id="touch">
    <button class="tk" data-key="90" aria-label="左挡板">◀</button>
    <div class="tk-center">
      <button class="tk tk-sm" data-key="113" aria-label="开新局">新局</button>
      <button class="tk tk-wide" data-key="32" aria-label="发球">发球</button>
    </div>
    <button class="tk" data-key="88" aria-label="右挡板">▶</button>
  </div>
  <button id="gear" aria-label="按键设置">⚙</button>
  <div id="kbPanel" role="dialog" aria-label="按键设置">
    <h3>按键设置 <button id="kbClose" aria-label="关闭">✕</button></h3>
    <div class="kb-row"><span>左挡板</span><button class="kb-key" data-slot="left"></button></div>
    <div class="kb-row"><span>右挡板</span><button class="kb-key" data-slot="right"></button></div>
    <div class="kb-row"><span>发球</span><button class="kb-key" data-slot="launch"></button></div>
    <div class="kb-row"><span>开新局</span><button class="kb-key" data-slot="new"></button></div>
    <div class="kb-foot">
      <button id="kbReset">恢复默认</button>
      <p class="kb-hint">点键位后按新键即可改绑;<br>Esc 取消,原默认键始终有效。</p>
    </div>
  </div>
</div>

<script>
  // 记录 SDL 把键盘监听挂在了哪个目标上(document / window / canvas 都可能有),
  // 触屏按钮才能把合成按键事件投递到真正收得到的地方。
  const keyTargets = new Set()
  const rawAdd = EventTarget.prototype.addEventListener
  EventTarget.prototype.addEventListener = function (type, fn, opts) {
    if (type === 'keydown' || type === 'keyup') keyTargets.add(this)
    return rawAdd.call(this, type, fn, opts)
  }

  const statusEl = document.getElementById('status')
  let statusDone = false

  window.Module = {
    canvas: (function () {
      const c = document.getElementById('canvas')
      c.addEventListener(
        'webglcontextlost',
        function (e) {
          e.preventDefault()
          showStatus('图形上下文丢失,刷新页面继续', false)
        },
        false,
      )
      return c
    })(),
    print: function () {},
    printErr: function (msg) {
      if (window.console) console.warn('[pinball]', msg)
    },
    setStatus: function (text) {
      if (!text) {
        statusEl.hidden = true
        statusDone = true
        return
      }
      if (statusDone || /All downloads complete/.test(text)) {
        statusEl.hidden = true
        return
      }
      showStatus(text, true)
    },
    monitorRunDependencies: function (left) {
      if (left === 0) statusEl.hidden = true
    },
  }

  function showStatus(text, spinner) {
    statusEl.hidden = false
    statusEl.textContent = spinner ? text : text
  }

  window.addEventListener('error', function (e) {
    if (!statusDone) showStatus('载入失败:' + (e.message || '未知错误'), false)
  })

  // —— 触屏 → 键盘 ——
  function pressKey(code, down) {
    // SDL 的键盘监听实测挂在 document 上;window 是 Emscripten 运行时先注册的,
    // 事件派发到 window 不会向下传到 document,SDL 收不到 —— 所以优先 document。
    const target = keyTargets.has(document)
      ? document
      : keyTargets.size
        ? keyTargets.values().next().value
        : document
    const ev = new KeyboardEvent(down ? 'keydown' : 'keyup', {
      key: String.fromCharCode(code),
      bubbles: true,
      cancelable: true,
    })
    Object.defineProperty(ev, 'keyCode', { get: () => code })
    Object.defineProperty(ev, 'which', { get: () => code })
    ev.__pbSynthetic = true
    target.dispatchEvent(ev)
  }

  // —— 按键设置:重绑定 + 翻译层 ——
  // 四个动作各自绑一个物理键(code 匹配);SDL 内部只认默认键码,改绑靠
  // 捕获阶段把用户的键翻译成默认键再转发给 SDL,原默认键始终直通。
  const SLOT_CANON = {
    left: { code: 'KeyZ', keyCode: 90 },
    right: { code: 'KeyX', keyCode: 88 },
    launch: { code: 'Space', keyCode: 32 },
    new: { code: 'F2', keyCode: 113 },
  }
  const DEFAULT_KEYS = {
    left: { code: 'KeyZ', key: 'z', keyCode: 90, label: 'Z' },
    right: { code: 'KeyX', key: 'x', keyCode: 88, label: 'X' },
    launch: { code: 'Space', key: ' ', keyCode: 32, label: '空格' },
    new: { code: 'F2', key: 'F2', keyCode: 113, label: 'F2' },
  }
  const KB_STORE = 'ihomy:pinball:keys:v1'
  let bindings = loadBindings()
  let listeningSlot = null

  function loadBindings() {
    try {
      const raw = JSON.parse(localStorage.getItem(KB_STORE) || '{}')
      const out = {}
      for (const slot of Object.keys(SLOT_CANON)) {
        const b = raw[slot]
        out[slot] =
          b && b.code && typeof b.keyCode === 'number'
            ? { code: b.code, key: b.key || '', keyCode: b.keyCode, label: b.label || b.code }
            : DEFAULT_KEYS[slot]
      }
      return out
    } catch (_) {
      return { ...DEFAULT_KEYS }
    }
  }
  function saveBindings() {
    try {
      localStorage.setItem(KB_STORE, JSON.stringify(bindings))
    } catch (_) {
      /* 隐私模式等写不进就算了,本次会话仍生效 */
    }
  }
  function keyLabel(key, code) {
    if (key === ' ') return '空格'
    if (!key) return code
    return key.length === 1 ? key.toUpperCase() : key
  }

  // 翻译层:window 捕获先于 document 上的 SDL 监听;命中改绑键就吃掉并
  // 转发默认键码。默认键与合成事件(触屏按钮/面板)直通不拦。
  function translateKey(e, down) {
    if (e.__pbSynthetic || listeningSlot) return
    for (const slot of Object.keys(SLOT_CANON)) {
      const b = bindings[slot]
      if (b.code === SLOT_CANON[slot].code) continue // 绑的就是默认键,无需翻译
      if (b.code === e.code) {
        e.preventDefault()
        e.stopPropagation()
        pressKey(SLOT_CANON[slot].keyCode, down)
        return
      }
    }
  }
  window.addEventListener(
    'keydown',
    function (e) {
      translateKey(e, true)
    },
    true,
  )
  window.addEventListener(
    'keyup',
    function (e) {
      translateKey(e, false)
    },
    true,
  )

  // —— 设置面板 ——
  const kbPanel = document.getElementById('kbPanel')
  const kbKeyBtns = document.querySelectorAll('#kbPanel .kb-key')
  function renderPanel() {
    kbKeyBtns.forEach(function (btn) {
      const slot = btn.dataset.slot
      btn.textContent = listeningSlot === slot ? '按新按键…' : bindings[slot].label
      btn.classList.toggle('listening', listeningSlot === slot)
    })
  }
  document.getElementById('gear').addEventListener('click', function () {
    listeningSlot = null
    kbPanel.classList.toggle('open')
    renderPanel()
  })
  document.getElementById('kbClose').addEventListener('click', function () {
    listeningSlot = null
    kbPanel.classList.remove('open')
  })
  document.getElementById('kbReset').addEventListener('click', function () {
    for (const slot of Object.keys(SLOT_CANON)) bindings[slot] = { ...DEFAULT_KEYS[slot] }
    listeningSlot = null
    saveBindings()
    renderPanel()
  })
  kbKeyBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      listeningSlot = btn.dataset.slot
      renderPanel()
    })
  })
  // 监听态:window 捕获抢先吃掉这一下,绑定为「物理键 code + 当时的键码」。
  // Esc 取消;没有 code 的键(修饰键怪异态等)忽略。
  window.addEventListener(
    'keydown',
    function (e) {
      if (!listeningSlot) return
      e.preventDefault()
      e.stopPropagation()
      if (e.key === 'Escape') {
        listeningSlot = null
        renderPanel()
        return
      }
      if (!e.code) return
      const slot = listeningSlot
      bindings[slot] = { code: e.code, key: e.key, keyCode: e.keyCode, label: keyLabel(e.key, e.code) }
      listeningSlot = null
      saveBindings()
      renderPanel()
    },
    true,
  )
  renderPanel()


  document.querySelectorAll('#touch .tk').forEach(function (btn) {
    const code = Number(btn.dataset.key)
    btn.addEventListener('pointerdown', function (e) {
      e.preventDefault()
      try {
        btn.setPointerCapture(e.pointerId)
      } catch (_) {
        /* 合成事件没有真实 pointerId,捕获失败不影响按键 */
      }
      pressKey(code, true)
    })
    const up = function (e) {
      e.preventDefault()
      pressKey(code, false)
    }
    btn.addEventListener('pointerup', up)
    btn.addEventListener('pointercancel', up)
  })

  // 点一下画面把焦点交给 canvas,否则外框里按键可能被父页面吃掉
  document.getElementById('stage').addEventListener('pointerdown', function () {
    const c = document.getElementById('canvas')
    if (c && c.focus) c.focus()
  })
</script>
<script async src="SpaceCadetPinball.js"></script>
</body>
</html>
