server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: ihomy
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:6306/ihomy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 使用专用应用账号 ihomy（最小权限，仅 DML），不要用 root 跑业务
    # 密码不入仓库:必须由外挂文件提供(设环境变量 IHOMY_CONFIG_PATH 指向 external.yml,见 external.yml.template)
    username: ihomy
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: com.ihomy.config.SqlStatementLog
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
# 密钥不入仓库:必须由外挂文件 external.yml 提供(缺失时后端启动即失败,防误用默认密钥)
jwt:
  secret:
  # 访问令牌有效期（秒）- 2小时
  access-token-expire: 7200
  # 刷新令牌有效期（秒）- 7天
  refresh-token-expire: 604800

# 文件上传存储
# 注意:upload-dir 必须与 nginx /files/ 的 alias 指向同一目录,用绝对路径避免随启动目录漂移
# 基线为生产路径;开发环境通过 external.yml(IHOMY_CONFIG_PATH)覆盖为 Windows 路径
file:
  upload-dir: /opt/ihomy/uploads
  url-prefix: /files

# 图形验证码:留空=随机生成(生产);开发环境通过 external.yml 覆盖为 qwer
# 和风天气:JWT(Ed25519)身份认证,凭证优先从 DB sys_weather_credential 表读 status=1 的记录
# ⚠️ 私钥不入 git:yml 留空,部署后通过外挂文件(IHOMY_CONFIG_PATH)或手动 UPDATE sys_weather_credential 填入
# 外挂文件中的敏感凭证可用 ENC(...) 格式 AES-GCM 加密,盐值存 sys_parameter 表(aes-salt),首次启动自动生成
# 加密工具:启动后调用 GET /api/ops/crypto/encrypt?plaintext=xxx 生成密文(OPS 角色)
app:
  captcha-fixed-code:
  weather-api-host:
  weather-project-id:
  weather-key-id:
  weather-private-key:
  # AI 大模型统一接入(V9.40,OpenAI 兼容 /chat/completions):物品定位 AI 语义及后续 AI 功能共用
  # 三项全配置才启用;api-key 支持 ENC(...) 加密(盐值 sys_parameter.aes-salt)
  ai:
    base-url:            # OpenAI 兼容服务地址(如 https://api.deepseek.com,不含路径),留空=未启用
    api-key:             # API Key(external.yml 覆盖,不入 git)
    model:               # 模型名(如 deepseek-chat)
    timeout-ms: 30000    # 单次调用超时(毫秒)
    # 图片生成(豆包 Seedream 等 OpenAI 兼容 /images/generations):model 配置才启用;地址/Key 留空复用上面主配置
    image-model:         # 图片模型名(如 doubao-seedream-4-0)
    image-base-url:      # 留空复用 base-url
    image-api-key:       # 留空复用 api-key
    # 语音识别(ASR,OpenAI 兼容 /audio/transcriptions):model 配置才启用;地址/Key 留空复用上面主配置
    asr-model:           # 语音识别模型名(如 SenseVoice)
    asr-base-url:        # 留空复用 base-url
    asr-api-key:         # 留空复用 api-key
  # 日志保留天数(logback 三类日志文件共用,按天滚动)
  log-retention-days: 7

logging:
  file:
    # 日志根目录:access/ server/ thirdparty/ 三个子目录(见 logback-spring.xml)
    # 基线为生产路径;开发环境通过 external.yml(IHOMY_CONFIG_PATH)覆盖为 Windows 路径
    path: /opt/ihomy/logs
  level:
    com.ihomy: info
    # SQL 语句+入参日志(进 server 日志文件,不进控制台)
    mybatis.sql: debug
    org.mybatis: warn
    org.springframework.jdbc: warn
