server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: ihomy
  datasource:
    url: jdbc:mysql://localhost:38654/ihomy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 使用专用应用账号 ihomy（最小权限，仅 DML），不要用 root 跑业务
    username: ihomy
    password: Ihomy@2026
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      # 宿主映射 18469->容器6379(避开 Hyper-V 排除端口段 6055-6754)
      port: 18469
      database: 0
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: com.ihomy.config.SqlStatementLog
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: ihomy-secret-key-please-change-in-production-2026-very-long
  # 访问令牌有效期（秒）- 2小时
  access-token-expire: 7200
  # 刷新令牌有效期（秒）- 7天
  refresh-token-expire: 604800

# 文件上传存储（本地兜底，生产建议使用 OSS/MinIO）
# 注意:upload-dir 必须与 nginx /files/ 的 alias 指向同一目录,用绝对路径避免随启动目录漂移
file:
  upload-dir: D:/WorkSpace/ihomy/uploads
  url-prefix: /files

# 图形验证码:开发/测试环境可固定为已知值(如 qwer),方便联调;生产去掉或留空则随机生成
# 和风天气:JWT(Ed25519)身份认证,凭证在控制台-项目管理获取
# ⚠️ 私钥不入 git(生产环境):以下字段生产留空,运行时从 DB sys_weather_credential 表读
#    本地开发可直接填入(DB 种子 private_key=NULL 时 fallback 到此 yml)
app:
  captcha-fixed-code: qwer
  weather-api-host: n93h2thv7x.re.qweatherapi.com
  weather-project-id: 26E5G7E7NQ
  weather-key-id: TKWEDN375N
  weather-private-key: |
    -----BEGIN PRIVATE KEY-----
    MC4CAQAwBQYDK2VwBCIEIBZifGunwvPX6SyTYx8XgWLTMOnFnaMHu5Bbr+Je7fus
    -----END PRIVATE KEY-----

logging:
  file:
    name: ./logs/ihomy.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %X{traceId:-} %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %X{traceId:-} %-5level %logger{36} - %msg%n"
  level:
    com.ihomy: info
    org.mybatis: warn
    org.springframework.jdbc: warn
