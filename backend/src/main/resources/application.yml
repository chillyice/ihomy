server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: ihomy
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:6306/ihomy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 使用专用应用账号 ihomy（最小权限，仅 DML），不要用 root 跑业务
    # 密码不入仓库:必须由外挂文件提供(设环境变量 IHOMY_CONFIG_PATH 指向 external.yml,见 external.yml.template)
    username: ihomy
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: com.ihomy.config.SqlStatementLog
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
# 密钥不入仓库:必须由外挂文件 external.yml 提供(缺失时后端启动即失败,防误用默认密钥)
jwt:
  secret:
  # 访问令牌有效期（秒）- 2小时
  access-token-expire: 7200
  # 刷新令牌有效期（秒）- 7天
  refresh-token-expire: 604800

# 文件上传存储
# 注意:upload-dir 必须与 nginx /files/ 的 alias 指向同一目录,用绝对路径避免随启动目录漂移
# 基线为生产路径;开发环境通过 external.yml(IHOMY_CONFIG_PATH)覆盖为 Windows 路径
file:
  upload-dir: /opt/ihomy/uploads
  url-prefix: /files

# 图形验证码:留空=随机生成(生产);开发环境通过 external.yml 覆盖为 qwer
# 和风天气:JWT(Ed25519)身份认证,凭证优先从 DB sys_weather_credential 表读 status=1 的记录
# ⚠️ 私钥不入 git:yml 留空,部署后通过外挂文件(IHOMY_CONFIG_PATH)或手动 UPDATE sys_weather_credential 填入
# 外挂文件中的敏感凭证可用 ENC(...) 格式 AES-GCM 加密,盐值存 sys_parameter 表(aes-salt),首次启动自动生成
# 加密工具:启动后调用 GET /api/ops/crypto/encrypt?plaintext=xxx 生成密文(OPS 角色)
app:
  captcha-fixed-code:
  # 跨域白名单(逗号分隔):生产域名 + 开发前端地址;经 external.yml 按环境覆盖
  cors-allowed-origins: https://ihomy.top
  weather-api-host:
  weather-project-id:
  weather-key-id:
  weather-private-key:
  # AI 大模型配置已按家庭(模型池 sys_family_ai_model + 功能绑定 sys_family_ai_feature,设置页-家庭 AI 配置维护),不再走全局 yml(V9.48)
  # 密码找回邮件:发件人(空=取 spring.mail.username);重置链接基址(指向前端重置页,邮件内拼接 ?token=)
  # SMTP 连接信息(spring.mail.*)留空即视为未开通,见 external.yml.template
  mail:
    from:
    reset-url-base: https://ihomy.top/reset-password
  # 日志保留天数(logback 三类日志文件共用,按天滚动)
  log-retention-days: 7
  # 同类异常聚合预警(运维页「异常预警」):同类问题在窗口内达到阈值时汇总成一条并提醒 OPS。
  # 采集端是 logback 的 LogAlertAppender(见 logback-spring.xml),计数在内存,落库/发信走后台单线程。
  log-alert:
    enabled: true
    # 参与聚合的级别(逗号分隔);含 WARN 会连访问慢请求一起统计,故默认只 ERROR
    levels: ERROR
    # 统计窗口(秒):窗口内同一指纹累加,到点重新计数
    window-seconds: 600
    # 阈值:窗口内同一指纹达到该次数即预警
    threshold: 10
    # 冷却(秒):同一指纹两次预警的最短间隔
    cooldown-seconds: 1800
    # 内存中同时跟踪的指纹上限(防异常消息含高基数内容撑爆内存)
    max-fingerprints: 200
    # 不参与聚合的 logger(逗号分隔),默认排除预警自身
    exclude-loggers: com.ihomy.service.LogAlertService
    # 预警记录保留天数
    retention-days: 30
    # 配好邮件通道(spring.mail.host)时是否向 OPS 邮箱发提醒;未配置则只在运维页展示
    mail-enabled: true

logging:
  file:
    # 日志根目录:access/ server/ thirdparty/ 三个子目录(见 logback-spring.xml)
    # 基线为生产路径;开发环境通过 external.yml(IHOMY_CONFIG_PATH)覆盖为 Windows 路径
    path: /opt/ihomy/logs
  level:
    com.ihomy: info
    # SQL 语句+入参日志(进 server 日志文件,不进控制台);默认 warn 静默,排查时经 external.yml 覆盖为 debug
    mybatis.sql: warn
    org.mybatis: warn
    org.springframework.jdbc: warn
