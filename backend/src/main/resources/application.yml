server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: ihomy
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:6306/ihomy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 使用专用应用账号 ihomy（最小权限，仅 DML），不要用 root 跑业务
    # 密码可通过外挂文件覆盖:设环境变量 IHOMY_CONFIG_PATH 指向 external.yml
    username: ihomy
    password: Ihomy@2026
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: com.ihomy.config.SqlStatementLog
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: ihomy-secret-key-please-change-in-production-2026-very-long
  # 访问令牌有效期（秒）- 2小时
  access-token-expire: 7200
  # 刷新令牌有效期（秒）- 7天
  refresh-token-expire: 604800

# 文件上传存储
# 注意:upload-dir 必须与 nginx /files/ 的 alias 指向同一目录,用绝对路径避免随启动目录漂移
# 基线为生产路径;开发环境通过 external.yml(IHOMY_CONFIG_PATH)覆盖为 Windows 路径
file:
  upload-dir: /opt/ihomy/uploads
  url-prefix: /files

# 图形验证码:留空=随机生成(生产);开发环境通过 external.yml 覆盖为 qwer
# 和风天气:JWT(Ed25519)身份认证,凭证优先从 DB sys_weather_credential 表读 status=1 的记录
# ⚠️ 私钥不入 git:yml 留空,部署后通过外挂文件(IHOMY_CONFIG_PATH)或手动 UPDATE sys_weather_credential 填入
# 外挂文件中的敏感凭证可用 ENC(...) 格式 AES-GCM 加密,盐值存 sys_parameter 表(aes-salt),首次启动自动生成
# 加密工具:启动后调用 GET /api/ops/crypto/encrypt?plaintext=xxx 生成密文(OPS 角色)
app:
  captcha-fixed-code:
  weather-api-host:
  weather-project-id:
  weather-key-id:
  weather-private-key:

logging:
  file:
    name: ./logs/ihomy.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %X{traceId:-} %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %X{traceId:-} %-5level %logger{36} - %msg%n"
  level:
    com.ihomy: info
    # SQL 语句日志:debug 才输出(由 SqlStatementLog 控制),生产保持 warn 静默
    mybatis.sql: warn
    org.mybatis: warn
    org.springframework.jdbc: warn
