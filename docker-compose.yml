# ihomy 本地开发中间件(MySQL + Redis)
# 用法:docker compose up -d(或 .\scripts\start-db.ps1 / setup.ps1,首次启动自动导入 schema.sql)
# 端口与生产对齐:MySQL 6306(容器内 3306)/ Redis 6379;容器名 ihomy-mysql / ihomy-redis。
# Redis 只绑 127.0.0.1 且带开发密码(见 redis 段),后端由 config/external.yml 的 spring.data.redis.password 接入。
# 数据持久化:命名卷 ihomy-mysql-data(重置数据库 = docker compose down -v)。
name: ihomy

services:
  mysql:
    image: mysql:8.4.10
    container_name: ihomy-mysql
    ports:
      - "6306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root   # 仅本机开发管理用;生产 root 密码不入库
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动(空数据卷)由 MySQL 入口脚本自动执行:建库建表+种子
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --performance_schema=OFF
      - --max_connections=30
    healthcheck:
      # 走 TCP(127.0.0.1)而非 socket:初始化阶段的临时服务器只开 socket,
      # socket ping 会在 schema 导入完成前误报 healthy
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  redis:
    # 固定大版本(不再 latest):避免隐式跨大版本升级;开发实跑 8.8.1(见台账 sys_oss_component)
    image: redis:8
    container_name: ihomy-redis
    ports:
      # 只绑本机回环:开发机/CI 的局域网不暴露 Redis(V10.6 加固)
      - "127.0.0.1:6379:6379"
    # 开发密码写在本文件(与 MYSQL_ROOT_PASSWORD 同性质,不入库外凭证);生产密码走 external.yml + 台账
    command: redis-server --requirepass ihomy-redis-dev-2026
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ihomy-redis-dev-2026 ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 放映厅媒体引擎(开发/联调用)。生产跑在家庭 NAS 上,ihomy 只通过 HTTP 调它的 REST API。
  # 带 profile,默认 `docker compose up -d` 不会启动;要用时:
  #   docker compose --profile jellyfin up -d jellyfin
  # 镜像默认走国内源(Docker Hub 直连被 DNS 污染);CI(海外 runner)用 JELLYFIN_IMAGE 覆盖为官方源。
  # 测试媒体放 .dev-media/(不入库,容器内 /media)。
  jellyfin:
    image: ${JELLYFIN_IMAGE:-docker.m.daocloud.io/jellyfin/jellyfin:10.9.11}
    container_name: ihomy-jellyfin
    profiles: ["jellyfin"]
    ports:
      - "8096:8096"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ./.dev-media:/media

volumes:
  mysql-data:
    name: ihomy-mysql-data
  jellyfin-config:
    name: ihomy-jellyfin-config
  jellyfin-cache:
    name: ihomy-jellyfin-cache
